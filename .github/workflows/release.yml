# The release on every push to main, that is the user's rebase merge of a PR
# (docs/workflow.md#release): the release rules CI checked on the PR, then `optilux pack release`,
# which applies them again, builds the zip and creates v<VERSION> at HEAD when absent. A version
# released already at another commit fails the run.
name: Release

on:
  push:
    branches: [main]

# The workflow token may create the release and its tag; naming one permission sets the others to
# none (docs/plans/m0.md P12).
permissions:
  contents: write

jobs:
  release:
    # Windows, as CI: the released zip is built where CI builds and checks it (zlib's DEFLATE
    # output may differ between builds; roadmap.md#qa-pass-open-questions, 0.01.12).
    runs-on: windows-latest
    defaults:
      run:
        shell: bash # as in ci.yml: the same commands on both runners
    steps:
      # Actions pinned to release tags (docs/plans/m0.md D13).
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.23" # the uv that wrote uv.lock (pyproject.toml, build-system)
      - run: uv sync --frozen
      - run: uv run optilux pack release --check
        env:
          # gh has no login of its own on a runner; it reads GH_TOKEN (docs/plans/m0.md P28).
          GH_TOKEN: ${{ github.token }}
      - run: uv run optilux pack release
        env:
          GH_TOKEN: ${{ github.token }}
