[project]
name = "optilux"
# Never bumped: the release version is the newest commit's prefix (docs/workflow.md, Git).
version = "0.0.0"
description = "Shader and runtime benchmark harness for Minecraft."
requires-python = ">=3.12"
dependencies = [
    "minecraft-launcher-lib==8.0",
    "psutil==7.2.2",
]

[project.scripts]
optilux = "optilux.cli:main"

[dependency-groups]
dev = [
    # coverage, pyright and pytest-xdist: the QA pass's tools (docs/roadmap.md#decisions D28).
    "coverage==7.16.2",
    "pyright[nodejs]==1.1.414",
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "ruff==0.16.10",
]

[build-system]
# Same version as the uv that locks the project, so uv builds with its built-in backend.
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "optilux"
# Flat layout: the package sits at the repo root, not under src/.
module-root = ""

[tool.ruff]
# 100: the width chosen in docs/plans/m0.md, phase 0.00.01.
line-length = 100
# ruff format also formats code blocks in Markdown; docs/sources/ is kept verbatim.
extend-exclude = ["docs/sources"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade; blind except, bandit, simplify, ruff's own and
# perflint (the QA pass, docs/roadmap.md#decisions D28). A hit is fixed, or suppressed on its line
# with the reason after the code.
select = ["E", "W", "F", "I", "B", "UP", "BLE", "S", "SIM", "RUF", "PERF"]

[tool.ruff.lint.per-file-ignores]
# pytest's assert is how a test states its check, not a runtime guard that -O would strip.
"tests/**" = ["S101"]

[tool.pyright]
# Basic mode over the harness, a CI step (docs/roadmap.md#decisions D28); tests are checked by
# running them.
include = ["optilux"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.coverage.run]
# The QA pass's one serial branch report (docs/workflow.md#testing): `uv run coverage run -m
# pytest tests`, then `uv run coverage report`.
branch = true
source = ["optilux"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests of Windows-only paths (user32 through ctypes, logman, a command line read back by
# psutil) carry this marker; tests/conftest.py skips them elsewhere (docs/plans/m1.md D19).
markers = ["windows: needs Windows; skipped on other systems"]
