# Gradle runs on the Temurin `optilux mod build|test` names through JAVA_HOME and
# org.gradle.java.home; no JDK is detected or downloaded (docs/plans/m1.md D18).
org.gradle.daemon=false
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.jvmargs=-Xmx1G

# The jar's sha512, not this version, is run identity (docs/mod.md#11-build-and-test).
version=0.1.0
group=optilux
