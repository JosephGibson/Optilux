# Optilux, the base pack: docs/shader.md, config/pipeline.json.
# Iris runs this file through its preprocessor with the pack's options defined; a line starting
# with "# " is a comment it drops.

# Vanilla AO into the vertex alpha of Sodium's terrain, apart from its colour (plans/m4.md P16).
separateAo = true
# Each hand's own held light, so the two can be merged without counting one twice (P17).
oldHandLight = false
# Under BENCH_DETERMINISTIC no rain or snow and no splash particles (plans/m4.md D79, P12):
# their state moves with the ticks before /tick freeze and the stepped ones.
#ifdef BENCH_DETERMINISTIC
weather = false false
#endif

# The settings screen: the bench's switch, the lighting options, and the dev options (E2's, the
# cost rows') on their own screen.
screen = BENCH_DETERMINISTIC SHADOWS HELD_LIGHT BLOCK_FLICKER SUN_SPECULAR FOLIAGE_TRANSLUCENCY \
 DITHER [DEV]
screen.DEV = LIGHT_PATH E2_LOAD SCENE_FORMAT OVERLAYS

# Block light's flicker, one value a frame (lib/flicker.glsl's flickerFactor, which
# tests/l3/uniforms.py holds it to): its amplitude per level, its clock frameTimeCounter, held at 0,
# the flicker's rest, under BENCH_DETERMINISTIC (plans/m4.md D79), the multiply left live.
#if BLOCK_FLICKER > 0
#if BLOCK_FLICKER == 1
variable.float.flickerAmplitude = 0.04
#elif BLOCK_FLICKER == 2
variable.float.flickerAmplitude = 0.08
#else
variable.float.flickerAmplitude = 0.12
#endif
#ifdef BENCH_DETERMINISTIC
variable.float.flickerClock = 0.0
#else
variable.float.flickerClock = frameTimeCounter
#endif
uniform.float.blockFlicker = 1.0 + flickerAmplitude * (0.6 * sin(flickerClock * 10.4719755) + \
 0.4 * sin(flickerClock * 3.49065850))
#endif

# E2_LOAD's loop count (program/shadowing.glsl), a custom uniform so that no compiler unrolls it.
#if E2_LOAD == 4
uniform.int.e2Load = 4
#elif E2_LOAD == 8
uniform.int.e2Load = 8
#elif E2_LOAD == 16
uniform.int.e2Load = 16
#endif
