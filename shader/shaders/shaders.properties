# Optilux, the base pack: docs/shader.md, config/pipeline.json.
# Iris runs this file through its preprocessor with the pack's options defined; a line starting
# with "# " is a comment it drops.

# Vanilla AO into the vertex alpha of Sodium's terrain, apart from its colour (plans/m4.md P16).
separateAo = true
# Each hand's own held light, so the two can be merged without counting one twice (P17).
oldHandLight = false

# The settings screen: the bench's switch, and E2's dev options on their own screen.
screen = BENCH_DETERMINISTIC [DEV]
screen.DEV = LIGHT_PATH E2_LOAD

# E2_LOAD's loop count (program/shadowing.glsl), a custom uniform so that no compiler unrolls it.
#if E2_LOAD == 4
uniform.int.e2Load = 4
#elif E2_LOAD == 8
uniform.int.e2Load = 8
#elif E2_LOAD == 16
uniform.int.e2Load = 16
#endif
